name: CI
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run format:check
        working-directory: frontend
      - run: node --test scripts/init-env.test.mjs
      - run: docker compose config --quiet
        env:
          API_TOKEN: ci-only-test-key-000000000000000000000000
          POSTGRES_PASSWORD: ci-only-database-password
      - run: npm run build
        working-directory: frontend
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: archive
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: archive_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U archive -d archive_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://archive:test-password@127.0.0.1:5432/archive_test
      API_TOKEN: ci-only-test-key-000000000000000000000000
      ALLOW_PRIVATE_FEED_HOSTS: 127.0.0.1
      DOWNLOAD_DIR: .test-runtime/downloads
      BIND_ADDRESS: 127.0.0.1:8080
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend
      - run: cargo build --locked
      - run: |
          mkdir -p .test-runtime
          target/debug/lewdarchive > .test-runtime/server.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/health; then exit 0; fi
            sleep 1
          done
          cat .test-runtime/server.log
          exit 1
      - run: node scripts/integration.mjs
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: node scripts/test-discord.mjs
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e --prefix frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: integration-diagnostics
          path: |
            .test-runtime/*.log
            .test-runtime/*.png
            frontend/test-results/
