services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    mem_limit: ${POSTGRES_MEM_LIMIT:-512m}
    cpus: ${POSTGRES_CPUS:-1.0}
    environment:
      POSTGRES_DB: lewdarchive
      POSTGRES_USER: lewdarchive
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U lewdarchive -d lewdarchive']
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: ${REDIS_MEM_LIMIT:-320m}
    cpus: ${REDIS_CPUS:-0.5}
    command:
      [redis-server, --appendonly, 'yes', --maxmemory, 256mb, --maxmemory-policy, allkeys-lru]
    volumes:
      - rsshub_cache:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 5s
      retries: 5
  rsshub:
    image: diygod/rsshub:chromium-bundled
    restart: unless-stopped
    mem_limit: ${RSSHUB_MEM_LIMIT:-1024m}
    cpus: ${RSSHUB_CPUS:-1.0}
    init: true
    shm_size: 256mb
    ports:
      - 127.0.0.1:1200:1200
    env_file:
      - path: .env.rsshub
        required: false
    environment:
      NODE_ENV: production
      CACHE_TYPE: redis
      REDIS_URL: redis://redis:6379/
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, -fsS, http://localhost:1200/healthz]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
  app:
    build: .
    restart: unless-stopped
    mem_limit: ${APP_MEM_LIMIT:-512m}
    cpus: ${APP_CPUS:-1.0}
    init: true
    ports:
      - 127.0.0.1:8080:8080
    environment:
      DATABASE_URL: postgres://lewdarchive:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/lewdarchive
      API_TOKEN: ${API_TOKEN:?Set API_TOKEN in .env}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      DISCORD_APPLICATION_ID: ${DISCORD_APPLICATION_ID:-}
      DISCORD_PUBLIC_KEY: ${DISCORD_PUBLIC_KEY:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      WD_TAGGER_URL: ${WD_TAGGER_URL:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      MAX_DOWNLOAD_MB: ${MAX_DOWNLOAD_MB:-100}
      ALLOW_PRIVATE_FEED_HOSTS: rsshub,${ALLOW_PRIVATE_FEED_HOSTS:-}
      RSSHUB_BASE_URL: ${RSSHUB_BASE_URL:-http://rsshub:1200}
      RUST_LOG: ${RUST_LOG:-lewdarchive=info,tower_http=info}
    volumes:
      - media_data:/data/downloads
    depends_on:
      postgres:
        condition: service_healthy
      rsshub:
        condition: service_healthy
      tagger:
        condition: service_healthy
        required: false
  tagger:
    profiles: [ai]
    build: ./tagger
    restart: unless-stopped
    mem_limit: ${TAGGER_MEM_LIMIT:-1536m}
    cpus: ${TAGGER_CPUS:-2.0}
    init: true
    environment:
      WD_CPU_THREADS: ${WD_CPU_THREADS:-2}
      WD_GENERAL_THRESHOLD: ${WD_GENERAL_THRESHOLD:-0.35}
      WD_CHARACTER_THRESHOLD: ${WD_CHARACTER_THRESHOLD:-0.85}
    volumes:
      - wd_models:/models
    # Internal service: raw images, no public listener or remote inference provider.
    read_only: true
    tmpfs:
      - /tmp:size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=5).close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10m
  cloudflared:
    profiles: [tunnel]
    image: cloudflare/cloudflared:latest
    container_name: lewdarchive_tunnel
    restart: unless-stopped
    mem_limit: ${CLOUDFLARED_MEM_LIMIT:-128m}
    cpus: ${CLOUDFLARED_CPUS:-0.5}
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - app
volumes:
  postgres_data:
  media_data:
  rsshub_cache:
  wd_models:
